name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]

# Cancel in-flight runs for same ref to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # For Trusted Publishing to PyPI (enable on PyPI project first):
  id-token: write

env:
  CACHE_VERSION: 1
  PRE_COMMIT_HOME: ~/.cache/pre-commit
  PRE_COMMIT_CACHE: ~/.cache/pre-commit

jobs:
  lint:
    name: pre-commit (dockerv)
    runs-on: ubuntu-latest
    container:
      image: quay.io/vauxoo/dockerv:latest
      options: --user root
    env:
      PIP_CACHE_DIR: "/root/.cache/pip"
      PRE_COMMIT_HOME: "/root/.cache/pre-commit"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pcache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install toolchain
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -U .  # install once with deps
          git config --global --add safe.directory '*'

      - name: Run pre-commit-vauxoo
        run: |
          pre-commit-vauxoo --show-diff-on-failure --color always

  test:
    name: tox (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.tox_env }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.python == '3.14-dev' }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest, macos-13, macos-latest]
        tox_env: ['py']
        include:
          - python: '3.13'
            os: ubuntu-latest
            tox_env: 'lint'
          - python: '3.13'
            os: ubuntu-latest
            tox_env: 'docs'
          - python: '3.13'
            os: ubuntu-latest
            tox_env: 'build'
          - python: '3.14-dev'
            os: ubuntu-latest
            tox_env: 'py'
        exclude:
          # macos-latest (ARM) doesn't support older Pythons
          - python: '3.10'
            os: macos-latest

    steps:
      - name: Normalize EOL (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: 'x64'
          cache: 'pip'

      - name: Cache tox
        uses: actions/cache@v4
        with:
          path: .tox
          key: tox-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}-${{ hashFiles('**/tox.ini', '**/pyproject.toml', '**/setup.cfg', '**/requirements*.txt') }}

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo rm -rf /var/lib/man-db/auto-update
          sudo apt-get install -y libxml2-dev libxslt1-dev zlib1g-dev libecpg-dev

      - name: Install test dependencies
        run: |
          python -m pip install --progress-bar=off -r test-requirements.txt
          pip --version
          pip list --format=freeze

      - name: Test == Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TOXPYTHON: '${{ matrix.toxpython }}'
        run: |
          [System.Environment]::SetEnvironmentVariable('PATH',$env:Path + ";" + $env:PGBIN)
          ecpg --version
          tox -e ${{ matrix.tox_env }} -v

      - name: Test != Windows
        if: runner.os != 'Windows'
        env:
          TOXPYTHON: '${{ matrix.toxpython }}'
        run: |
          tox -e ${{ matrix.tox_env }} -v

      - name: Upload test reports
        if: startsWith(matrix.tox_env, 'py')
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .tox/**/junit*.xml
            .tox/**/coverage*.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Codecov
        if: startsWith(matrix.tox_env, 'py')
        uses: codecov/codecov-action@v4
        with:
          verbose: true
          fail_ci_if_error: false

  build:
    name: Build sdist/wheels
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -lah dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 14

  publish:
    name: Publish to PyPI & trigger Dockerv
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Preferred: PyPI Trusted Publishing (no API token)
      - name: Publish (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          verbose: true

      - name: Trigger Dockerv pipeline
        run: |
          curl -X POST \
            -F token=${{ secrets.TRIGGER_TOKEN_DOCKERV }} \
            -F ref=master \
            https://git.vauxoo.com/api/v4/projects/443/trigger/pipeline
